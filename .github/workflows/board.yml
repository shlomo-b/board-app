name: Docker Image CI

# Same pipeline for every app. A folder is an app when it contains
# Dockerfile and image-tag.txt. image-tag.txt is <image>-v<version>
# (board-v1.0.0) or only a version (v1.0.0, image name is the folder).
# GitHub cannot use env or the app name in on.paths, so this workflow
# reads the changed files and publishes only the app those files belong to.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find apps
        id: find
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          changed=$(mktemp)
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            find . -type f -not -path '*/.git/*' | sed 's#^\./##' > "$changed"
          else
            git diff --name-only "$base" "${{ github.sha }}" > "$changed"
          fi

          apps='[]'
          found_any=0
          while IFS= read -r dockerfile; do
            dir=$(dirname "$dockerfile")
            dir=${dir#./}
            if [ "$dir" = "." ]; then
              tagfile="image-tag.txt"
            else
              tagfile="$dir/image-tag.txt"
            fi
            if [ ! -f "$tagfile" ]; then
              continue
            fi
            found_any=1
            changed_app=0
            if [ "$dir" = "." ]; then
              changed_app=1
            else
              while IFS= read -r file; do
                case "$file" in
                  "$dir"/*) changed_app=1; break ;;
                esac
              done < "$changed"
            fi
            if [ "$changed_app" = 0 ]; then
              continue
            fi
            tag=$(tr -d '[:space:]' < "$tagfile")
            if [ -z "$tag" ]; then
              echo "image-tag.txt is empty in $dir" >&2
              exit 1
            fi
            if [[ "$tag" == *-v* ]]; then
              image="${tag%%-v*}"
              version="${tag#"${image}-"}"
            else
              image=$(basename "$dir")
              version="$tag"
            fi
            apps=$(jq -cn \
              --argjson apps "$apps" \
              --arg path "$dir" \
              --arg image "$image" \
              --arg tag "$tag" \
              --arg version "$version" \
              '$apps + [{path:$path, image:$image, tag:$tag, version:$version}]')
          done < <(find . -type f -name Dockerfile -not -path '*/.git/*' -not -path '*/node_modules/*' | sort)

          if [ "$found_any" = 0 ]; then
            echo "No directory with a Dockerfile and image-tag.txt" >&2
            exit 1
          fi
          echo "Apps to build: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  docker:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Hadolint (Dockerfile lint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.app.path }}/Dockerfile
          failure-threshold: warning

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan (misconfig + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ matrix.app.path }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln,secret,config'

      - name: read file
        id: tag
        run: |
          echo "contents=$(tr -d '[:space:]' < "${{ matrix.app.path }}/image-tag.txt")" >> "$GITHUB_OUTPUT"

      - name: PrintFile contents
        run: echo "${{ steps.tag.outputs.contents }}"

      - name: Build Docker image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.path }}
          file: ${{ matrix.app.path }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.app.image }}:${{ steps.tag.outputs.contents }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan local image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ matrix.app.image }}:${{ steps.tag.outputs.contents }}'
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Print image tag
        run: echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.image }}:${{ steps.tag.outputs.contents }}"

      - name: output tag image only
        id: tag-only
        run: echo "tag-image=${{ matrix.app.version }}" >> "$GITHUB_OUTPUT"

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.path }}
          file: ${{ matrix.app.path }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.image }}:${{ steps.tag-only.outputs.tag-image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag from file
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.tag.outputs.contents }}
          git push origin ${{ steps.tag.outputs.contents }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
